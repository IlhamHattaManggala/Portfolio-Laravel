version: '3.8'

services:
  # ==========================================
  # 🌐 Portfolio Web Server (PHP-FPM + Nginx)
  # ==========================================
  portfolio-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: portfolio:latest
    container_name: portfolio-web
    restart: unless-stopped
    ports:
      - "8000:80"
    env_file:
      - .env
    volumes:
      - portfolio-storage:/var/www/html/storage
    networks:
      - proxy
      - database
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      # Traefik Router configuration
      - "traefik.http.routers.portfolio.rule=Host(`${PORTFOLIO_DOMAIN:-localhost}`)"
      - "traefik.http.routers.portfolio.entrypoints=websecure"
      - "traefik.http.routers.portfolio.tls=true"
      - "traefik.http.routers.portfolio.tls.certresolver=myresolver"
      - "traefik.http.services.portfolio.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ==========================================
  # ⚙️ Portfolio Background Queue Worker
  # ==========================================
  portfolio-worker:
    image: portfolio:latest
    container_name: portfolio-worker
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=90", "--sleep=3"]
    env_file:
      - .env
    volumes:
      - portfolio-storage:/var/www/html/storage
    networks:
      - database
    stop_grace_period: 30s

networks:
  proxy:
    external: true
  database:
    external: true

volumes:
  portfolio-storage:
