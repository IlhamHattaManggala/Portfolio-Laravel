name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        env:
          S1_HOST: ${{ secrets.VPS_HOST }}
          S2_HOST: ${{ secrets.VPSHOST }}
          S1_USER: ${{ secrets.VPS_USERNAME }}
          S2_USER: ${{ secrets.VPSUSERNAME }}
          S1_KEY: ${{ secrets.VPS_SSH_KEY }}
          S2_KEY: ${{ secrets.VPSSSHKEY }}
        run: |
          set -e
          HOST="${S1_HOST:-$S2_HOST}"
          USER="${S1_USER:-$S2_USER}"
          KEY="${S1_KEY:-$S2_KEY}"

          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$KEY" ]; then
            echo "::error::Missing required secret(s)"
            exit 1
          fi

          mkdir -p ~/.ssh
          printf "%s\n" "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_deploy -p 22 "${USER}@${HOST}" << 'EOF'
            set -e
            cd /opt/apps/Portfolio-Laravel
            git pull origin main
            docker compose build portfolio-web
            docker compose up -d
            docker compose exec -T portfolio-web php artisan optimize
          EOF
