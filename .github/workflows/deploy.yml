name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set +e
          echo "Host: ${VPS_HOST}"
          echo "User: ${VPS_USERNAME}"
          if [ -z "$VPS_SSH_KEY" ]; then
            echo "::error::VPS_SSH_KEY is empty"
            exit 1
          fi

          mkdir -p ~/.ssh
          printf "%s\n" "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          ssh-keygen -l -f ~/.ssh/id_deploy > /tmp/keycheck.log 2>&1
          KEY_CHECK=$?
          if [ $KEY_CHECK -ne 0 ]; then
            MSG=$(cat /tmp/keycheck.log)
            echo "::error::SSH Key Invalid: $MSG"
            exit 1
          fi

          ssh -vv -o ConnectTimeout=15 -o StrictHostKeyChecking=no -i ~/.ssh/id_deploy -p 22 "${VPS_USERNAME}@${VPS_HOST}" "echo SSH SUCCESS" > /tmp/ssh.log 2>&1
          SSH_STATUS=$?
          if [ $SSH_STATUS -ne 0 ]; then
            MSG=$(tail -n 12 /tmp/ssh.log | tr '\n' ' | ')
            echo "::error::SSH Connect Failed: $MSG"
            exit $SSH_STATUS
          fi

          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_deploy -p 22 "${VPS_USERNAME}@${VPS_HOST}" << 'EOF'
            set -e
            cd /opt/apps/Portfolio-Laravel
            git pull origin main
            docker compose build portfolio-web
            docker compose up -d
            docker compose exec -T portfolio-web php artisan optimize
          EOF
