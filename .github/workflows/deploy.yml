name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          {
            echo "Checking secrets..."
            if [ -z "$VPS_HOST" ]; then
              echo "VPS_HOST is EMPTY"
            else
              echo "VPS_HOST=$VPS_HOST"
            fi
            if [ -z "$VPS_USERNAME" ]; then
              echo "VPS_USERNAME is EMPTY"
            else
              echo "VPS_USERNAME=$VPS_USERNAME"
            fi
            if [ -z "$VPS_SSH_KEY" ]; then
              echo "VPS_SSH_KEY is EMPTY"
            else
              echo "VPS_SSH_KEY is present"
            fi

            mkdir -p ~/.ssh
            printf "%s\n" "$VPS_SSH_KEY" > ~/.ssh/id_deploy
            chmod 600 ~/.ssh/id_deploy

            echo "Connecting via SSH..."
            ssh -vv -o ConnectTimeout=15 -o StrictHostKeyChecking=no -i ~/.ssh/id_deploy -p 22 "${VPS_USERNAME}@${VPS_HOST}" << 'EOF'
              set -e
              cd /opt/apps/Portfolio-Laravel
              git pull origin main
              docker compose build portfolio-web
              docker compose up -d
              docker compose exec -T portfolio-web php artisan optimize
          EOF
          } > /tmp/output.log 2>&1
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            cat /tmp/output.log
            ERR_MSG=$(tail -n 15 /tmp/output.log | tr '\n' ' -- ')
            echo "::error title=Deploy Failure::$ERR_MSG"
            exit $STATUS
          fi
